appId: com.bibliotecapdf.app
productName: Biblioteca PDF
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: Biblioteca-PDF-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Biblioteca PDF
